<!DOCTYPE html>
<html lang="en">
<head>

    <title>Blog Website - Home</title>

<body>

        <h1 class="site-title">Blog Website</h1>

        <article class="post-card">
            <img src="https://picsum.photos/id/1056/300/300" alt="Landscape" class="post-image">

                <a href="post.html">Another Blog Post</a>

            <p class="post-excerpt">
                This is another blog post summary. Click the title to read more...

</html>
