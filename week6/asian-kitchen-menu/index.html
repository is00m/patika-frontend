<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asian Kitchen Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-content">
          <span class="eyebrow">Asian Kitchen</span>
          <h1>Street Food Menu</h1>
          <p class="subhead">
            Tiny plates, bold heat, fresh herbs, and deep broths. Filter by region
            and build your own table.
          </p>
          <div id="buttons" class="button-group" aria-label="Menu categories"></div>
        </div>
        <div class="hero-card" aria-hidden="true">
          <div class="hero-card-inner">
            <p class="card-title">Chef note</p>
            <p class="card-copy">
              We keep the wok hot, the noodles springy, and the sauces bright.
              Pick a region and let the aromas guide you.
            </p>
            <div class="tag-row">
              <span class="tag">fresh</span>
              <span class="tag">handmade</span>
              <span class="tag">seasonal</span>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <section id="menu" class="menu" aria-live="polite"></section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
